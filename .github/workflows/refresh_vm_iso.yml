name: Refresh VM ISO List

on:
  schedule:
    # Daily at 03:17 Asia/Shanghai (UTC+8).
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      windows_sync:
        description: Windows ISO synchronization (auto follows WINDOWS_ISO_SYNC_ENABLED)
        type: choice
        default: auto
        options:
          - auto
          - preview
          - publish
          - skip

concurrency:
  group: refresh-vm-iso
  cancel-in-progress: false

env:
  PYTHONPATH: .github/scripts

jobs:
  sync-windows:
    if: >-
      inputs.windows_sync != 'skip' &&
      (vars.WINDOWS_ISO_SYNC_ENABLED == 'true' ||
       inputs.windows_sync == 'preview' || inputs.windows_sync == 'publish')
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://vm-iso.zimaos.com' }}
      R2_MANIFEST_KEY: ${{ vars.R2_MANIFEST_KEY || 'manifests/windows.json' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SYNC_MODE: ${{ inputs.windows_sync || 'auto' }}
      SYNC_ENABLED: ${{ vars.WINDOWS_ISO_SYNC_ENABLED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout pinned Fido
        uses: actions/checkout@v7
        with:
          repository: pbatard/Fido
          ref: 266084e3765ab8bf96767bd55c51b0ee70934551 # v1.72; reviewed download-link resolver
          path: .tools/fido
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Windows publisher dependencies
        run: python -m pip install -r .github/requirements-windows.txt

      - name: Test publisher and validate PowerShell syntax
        shell: pwsh
        run: |
          python -m unittest discover -s .github/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parseErrors = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD ".github/scripts/inspect_windows_iso.ps1"), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }

      - name: Synchronize Microsoft ISOs to R2
        shell: pwsh
        run: |
          $arguments = @(
            ".github/scripts/sync_windows_iso.py",
            "--report", (Join-Path $env:RUNNER_TEMP "windows-sync-report.json"),
            "--public-base-url", $env:R2_PUBLIC_BASE_URL,
            "--manifest-key", $env:R2_MANIFEST_KEY,
            "--work-dir", $env:RUNNER_TEMP
          )
          if ($env:SYNC_MODE -eq "publish" -or
              ($env:SYNC_MODE -ne "preview" -and $env:SYNC_ENABLED -eq "true")) {
            $arguments += "--publish"
          } else {
            $arguments += "--dry-run"
          }
          python @arguments
          exit $LASTEXITCODE

      - name: Publish Windows synchronization report
        if: always()
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "windows-sync-report.json"
          if (Test-Path -LiteralPath $report) {
            "### Windows ISO synchronization" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '<pre>' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            [System.Net.WebUtility]::HtmlEncode((Get-Content $report -Raw)) |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '</pre>' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

  refresh:
    needs: sync-windows
    # A failed Windows batch leaves the previous manifest intact; Linux can proceed.
    if: ${{ always() && !cancelled() && inputs.windows_sync != 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements.txt

      - name: Test refresh logic
        run: python -m unittest discover -s .github/tests -v

      - name: Refresh image URLs and versions
        env:
          WINDOWS_ISO_MANIFEST_URL: ${{ secrets.WINDOWS_ISO_MANIFEST_URL }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://vm-iso.zimaos.com' }}
          R2_MANIFEST_KEY: ${{ vars.R2_MANIFEST_KEY || 'manifests/windows.json' }}
          SYNC_ENABLED: ${{ vars.WINDOWS_ISO_SYNC_ENABLED }}
          SYNC_MODE: ${{ inputs.windows_sync || 'auto' }}
        run: |
          if [ -z "$WINDOWS_ISO_MANIFEST_URL" ] && { [ "$SYNC_ENABLED" = "true" ] || [ "$SYNC_MODE" = "publish" ]; }; then
            export WINDOWS_ISO_MANIFEST_URL="${R2_PUBLIC_BASE_URL%/}/$R2_MANIFEST_KEY"
          fi
          python .github/scripts/refresh_vm_iso.py --check-latest --file vm-iso.json --report "$RUNNER_TEMP/vm-iso-refresh-report.md"

      - name: Publish report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/vm-iso-refresh-report.md" ]; then
            cat "$RUNNER_TEMP/vm-iso-refresh-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: bot/refresh-vm-iso
          delete-branch: true
          commit-message: 'chore: refresh vm iso list'
          title: 'chore: refresh vm iso list'
          body-path: ${{ runner.temp }}/vm-iso-refresh-report.md
          add-paths: |
            vm-iso.json
